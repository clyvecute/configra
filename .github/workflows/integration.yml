name: Integration
on:
  push:
  pull_request:
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: configra
          POSTGRES_PASSWORD: configra
          POSTGRES_DB: configra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U configra -d configra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONFIGRA_TEST_DATABASE_URL: postgres://configra:configra@localhost:5432/configra_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
